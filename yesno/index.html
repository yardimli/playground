<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Yes/No Phaser Game</title>
	<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body style="margin: 0; padding: 0; overflow: hidden;">
<script>
	// Assuming you have Phaser 3 loaded in your project
	const config = {
		type: Phaser.AUTO,
		width: window.innerWidth,
		height: window.innerHeight,
		scene: {
			preload: preload,
			create: create,
			update: update
		}
	};
	
	const game = new Phaser.Game(config);
	let questionText, answerText = "", keyboardKeys = [];
	let currentQuestionIndex = 0;
	let questions = [];
	let tryAgainText, clickSound, buzzerSound, successSound;
	let submitButton, submitButtonText;
	let backspaceButton, backspaceText;
	let failedAttempts = 0;
	let yesButton, noButton, yesButtonText, noButtonText, yesButtonBox, noButtonBox, yesNoBackgroundBox;
	let editButton, parentSettingsMode = false;
	let logTextarea;
	let disableKeyboard = JSON.parse(localStorage.getItem('disableKeyboard')) || false;
	let maxFailedAttemptsBeforeYesNo = parseInt(localStorage.getItem('maxFailedAttemptsBeforeYesNo')) || 3;
	
	function preload() {
		// Load assets if needed (e.g., images, sounds, etc.)
		this.load.audio('click', 'click.mp3');
		this.load.audio('buzzer', 'wrong.wav');
		this.load.audio('success', 'success.wav');
		this.load.json('questions', 'questions.json');
	}
	
	function create() {
		// Load questions from local storage or initialize with default questions
		const storedQuestions = localStorage.getItem('questions');
		questions = storedQuestions ? JSON.parse(storedQuestions) : this.cache.json.get('questions').questions;
		
		// Display the question
		questionText = this.add.text(config.width / 2, 60, questions[currentQuestionIndex], {
			fontSize: '48px',
			fill: '#fff',
			wordWrap: { width: config.width * 0.8, useAdvancedWrap: true },
			align: 'center'
		}).setOrigin(0.5);
		
		// Display the answer area inside a centered box
		const answerBox = this.add.rectangle(config.width / 2, 160, config.width * 0.3, 80, 0xffffff).setStrokeStyle(4, 0x000000);
		answerText = this.add.text(config.width / 2 - (config.width * 0.3) / 2 + 10, 140, '', { fontSize: '48px', fill: '#000' });
		
		// Load sounds
		clickSound = this.sound.add('click');
		buzzerSound = this.sound.add('buzzer');
		successSound = this.sound.add('success');
		
		// Create edit button in the top left corner
		parentSettingsButton = this.add.rectangle(70, 50, 100, 50, 0x0000ff)
			.setInteractive({ useHandCursor: true });
		this.add.text(70, 50, 'PARENT', { fontSize: '24px', fill: '#fff' }).setOrigin(0.5);
		
		parentSettingsButton.on('pointerdown', () => {
			parentSettingsMode = true;
			setTimeout(() => {
				if (parentSettingsMode) {
					openParentSettingsMode();
				}
			}, 1000);
		});
		
		parentSettingsButton.on('pointerup', () => {
			parentSettingsMode = false;
		});
		
		// Create the on-screen keyboard (QWERTY layout)
		if (!disableKeyboard) {
			createKeyboard.call(this);
		}
		
		// Add backspace button next to the input area
		backspaceButton = this.add.rectangle(config.width / 2 + config.width * 0.2 + 40, 160, config.width * 0.1, 80, 0xffd700)
			.setStrokeStyle(4, 0x000000)
			.setInteractive({ useHandCursor: true });
		backspaceText = this.add.text(config.width / 2 + config.width * 0.2 + 40, 160, '←', {
			fontSize: '48px',
			fill: '#000'
		}).setOrigin(0.5);
		
		backspaceButton.on('pointerdown', () => {
			handleKeyInput('←');
			clickSound.play();
			backspaceButton.setFillStyle(0x888888); // Click effect
		});
		
		backspaceButton.on('pointerover', () => {
			backspaceButton.setStrokeStyle(4, 0xffff00); // Hover effect
		});
		
		backspaceButton.on('pointerout', () => {
			backspaceButton.setStrokeStyle(4, 0x000000); // Reset effect
		});
		
		backspaceButton.on('pointerup', () => {
			backspaceButton.setFillStyle(0xffd700); // Reset click effect
		});
		
		// Add submit button at the bottom of the screen, as wide as the screen
		submitButton = this.add.rectangle(config.width / 2, config.height - 100, config.width * 0.9, 100, 0xff0000)
			.setInteractive({ useHandCursor: true })
			.setStrokeStyle(4, 0xffffff);
		submitButtonText = this.add.text(config.width / 2, config.height - 100, 'SUBMIT', {
			fontSize: '56px',
			fill: '#fff'
		}).setOrigin(0.5);
		
		submitButton.on('pointerdown', () => {
			handleSubmit();
			submitButton.setFillStyle(0x888888); // Click effect
		});
		
		submitButton.on('pointerover', () => {
			submitButton.setStrokeStyle(4, 0xffff00); // Hover effect
		});
		
		submitButton.on('pointerout', () => {
			submitButton.setStrokeStyle(4, 0xffffff); // Reset effect
		});
		
		submitButton.on('pointerup', () => {
			submitButton.setFillStyle(0xff0000); // Reset click effect
		});
		
		// Create "Please try again" text (initially hidden)
		tryAgainText = this.add.text(config.width / 2, config.height / 2, 'PLEASE TRY AGAIN', {
			fontSize: '48px',
			fill: '#f00',
			backgroundColor: '#fff',
			padding: { x: 20, y: 20 },
			align: 'center'
		}).setOrigin(0.5).setVisible(false);
		
		// Create Yes and No buttons (initially hidden)
		yesNoBackgroundBox = this.add.rectangle(config.width / 2, config.height / 2 , 700, 300, 0x808080)
			.setStrokeStyle(4, 0x000000).setVisible(false);
		
		yesButtonBox = this.add.rectangle(config.width / 2 - 170, config.height / 2 , 300, 160, 0x006400)
			.setStrokeStyle(4, 0x000000).setVisible(false);
		yesButton = this.add.rectangle(config.width / 2 - 170, config.height / 2 , 300, 160, 0x00ff00)
			.setInteractive({ useHandCursor: true }).setVisible(false);
		yesButtonText = this.add.text(config.width / 2 - 170, config.height / 2 , 'YES', {
			fontSize: '96px',
			fill: '#000'
		}).setOrigin(0.5).setVisible(false);
		
		noButtonBox = this.add.rectangle(config.width / 2 + 170, config.height / 2 , 300, 160, 0x8b0000)
			.setStrokeStyle(4, 0x000000).setVisible(false);
		noButton = this.add.rectangle(config.width / 2 + 170, config.height / 2 , 300, 160, 0xff0000)
			.setInteractive({ useHandCursor: true }).setVisible(false);
		noButtonText = this.add.text(config.width / 2 + 170, config.height / 2 , 'NO', {
			fontSize: '96px',
			fill: '#000'
		}).setOrigin(0.5).setVisible(false);
		
		yesButton.on('pointerdown', () => {
			handleAnswer('YES');
		});
		
		noButton.on('pointerdown', () => {
			handleAnswer('NO');
		});
		
		if (disableKeyboard) {
			showYesNoButtons();
			backspaceButton.setVisible(false);
			backspaceText.setVisible(false);
			answerText.setVisible(false);
			answerBox.setVisible(false);
			submitButtonText.setVisible(false);
			submitButton.setVisible(false).disableInteractive();
		}
	}
	
	function openParentSettingsMode() {
		// Disable Phaser buttons
		parentSettingsButton.disableInteractive();
		if (!disableKeyboard) {
			keyboardKeys.forEach(({ keyButton }) => keyButton.disableInteractive());
		}
		backspaceButton.disableInteractive();
		submitButton.disableInteractive();
		yesButton.disableInteractive();
		noButton.disableInteractive();
		
		// Create HTML elements for editing
		const editDiv = document.createElement('div');
		editDiv.style.position = 'absolute';
		editDiv.style.top = '10%';
		editDiv.style.left = '10%';
		editDiv.style.width = '80%';
		editDiv.style.height = '80%';
		editDiv.style.backgroundColor = '#333';
		editDiv.style.padding = '20px';
		editDiv.style.color = '#fff';
		editDiv.style.zIndex = '1000';
		
		const textarea = document.createElement('textarea');
		textarea.style.width = '98%';
		textarea.style.height = '60%';
		textarea.style.backgroundColor = '#444';
		textarea.style.color = '#fff';
		textarea.style.border = '1px solid #666';
		textarea.style.padding = '10px';
		textarea.style.fontSize = '18px';
		textarea.value = questions.join('\n');
		
		// Create log textarea for storing answers
		const logTextarea = document.createElement('textarea');
		logTextarea.style.width = '98%';
		logTextarea.style.height = '20%';
		logTextarea.style.backgroundColor = '#444';
		logTextarea.style.color = '#fff';
		logTextarea.style.border = '1px solid #666';
		logTextarea.style.padding = '10px';
		logTextarea.style.fontSize = '18px';
		logTextarea.value = localStorage.getItem('log') || '';
		
		// Checkbox to disable the keyboard
		const disableKeyboardCheckbox = document.createElement('input');
		disableKeyboardCheckbox.type = 'checkbox';
		disableKeyboardCheckbox.checked = disableKeyboard;
		const disableKeyboardLabel = document.createElement('label');
		disableKeyboardLabel.style.marginLeft = '10px';
		disableKeyboardLabel.style.color = '#fff';
		disableKeyboardLabel.textContent = 'Disable Keyboard';
		
		disableKeyboardCheckbox.onchange = () => {
			disableKeyboard = disableKeyboardCheckbox.checked;
		};
		
		// Input to set max failed attempts before showing Yes/No
		const maxAttemptsInput = document.createElement('input');
		maxAttemptsInput.type = 'number';
		maxAttemptsInput.value = maxFailedAttemptsBeforeYesNo;
		maxAttemptsInput.style.marginLeft = '10px';
		const maxAttemptsLabel = document.createElement('label');
		maxAttemptsLabel.style.marginLeft = '10px';
		maxAttemptsLabel.style.color = '#fff';
		maxAttemptsLabel.textContent = 'Max Failed Attempts Before Yes/No';
		
		maxAttemptsInput.onchange = () => {
			maxFailedAttemptsBeforeYesNo = parseInt(maxAttemptsInput.value);
		};
		
		const buttonDiv = document.createElement('div');
		buttonDiv.style.marginTop = '10px';
		
		const saveButton = document.createElement('button');
		saveButton.textContent = 'Save';
		saveButton.style.marginRight = '10px';
		saveButton.style.marginBottom = '10px';
		saveButton.style.padding = '5px 10px';
		saveButton.style.backgroundColor = '#007bff';
		saveButton.style.color = '#fff';
		saveButton.style.border = 'none';
		saveButton.style.cursor = 'pointer';
		saveButton.style.fontSize = '22px';
		saveButton.onclick = () => {
			questions = textarea.value.split('\n').filter(line => line.trim() !== '');
			localStorage.setItem('questions', JSON.stringify(questions));
			localStorage.setItem('log', logTextarea.value);
			localStorage.setItem('disableKeyboard', JSON.stringify(disableKeyboard));
			localStorage.setItem('maxFailedAttemptsBeforeYesNo', maxFailedAttemptsBeforeYesNo);
			document.body.removeChild(editDiv);
			location.reload();
			location.reload();
			currentQuestionIndex = 0;
			questionText.setText(questions[currentQuestionIndex]);
			// Re-enable Phaser buttons
			parentSettingsButton.setInteractive({ useHandCursor: true });
			if (!disableKeyboard) {
				keyboardKeys.forEach(({ keyButton }) => keyButton.setInteractive({ useHandCursor: true }));
			}
			backspaceButton.setInteractive({ useHandCursor: true });
			submitButton.setInteractive({ useHandCursor: true });
			yesButton.setInteractive({ useHandCursor: true });
			noButton.setInteractive({ useHandCursor: true });
		};
		
		const resetButton = document.createElement('button');
		resetButton.textContent = 'Reset';
		resetButton.style.marginRight = '10px';
		resetButton.style.marginBottom = '10px';
		resetButton.style.padding = '5px 10px';
		resetButton.style.backgroundColor = '#dc3545';
		resetButton.style.color = '#fff';
		resetButton.style.border = 'none';
		resetButton.style.cursor = 'pointer';
		resetButton.style.fontSize = '22px';
		resetButton.onclick = () => {
			const defaultQuestions = game.scene.keys.default.cache.json.get('questions').questions;
			questions = defaultQuestions;
			textarea.value = questions.join('\n');
		};
		
		const closeButton = document.createElement('button');
		closeButton.textContent = 'Close';
		closeButton.style.padding = '5px 10px';
		closeButton.style.backgroundColor = '#28a745';
		closeButton.style.color = '#fff';
		closeButton.style.border = 'none';
		closeButton.style.cursor = 'pointer';
		closeButton.style.fontSize = '22px';
		closeButton.onclick = () => {
			document.body.removeChild(editDiv);
			// Re-enable Phaser buttons
			parentSettingsButton.setInteractive({ useHandCursor: true });
			if (!disableKeyboard) {
				keyboardKeys.forEach(({ keyButton }) => keyButton.setInteractive({ useHandCursor: true }));
			}
			backspaceButton.setInteractive({ useHandCursor: true });
			submitButton.setInteractive({ useHandCursor: true });
			yesButton.setInteractive({ useHandCursor: true });
			noButton.setInteractive({ useHandCursor: true });
		};
		
		editDiv.appendChild(textarea);
		editDiv.appendChild(disableKeyboardCheckbox);
		editDiv.appendChild(disableKeyboardLabel);
		editDiv.appendChild(maxAttemptsInput);
		editDiv.appendChild(maxAttemptsLabel);
		buttonDiv.appendChild(saveButton);
		buttonDiv.appendChild(resetButton);
		buttonDiv.appendChild(closeButton);
		editDiv.appendChild(buttonDiv);
		editDiv.appendChild(logTextarea);
		document.body.appendChild(editDiv);
	}
	
	function createKeyboard() {
		const rows = [
			'qwertyuiop'.split(''),
			'asdfghjkl'.split(''),
			'zxcvbnm'.split('')
		];
		const startX = config.width * 0.05;
		const startY = config.height * 0.35;
		const keySpacingX = (config.width - 2 * startX) / 10;
		const keySpacingY = (config.height * 0.4) / rows.length;
		let currentY = startY;
		
		scene = this;
		rows.forEach(row => {
			let currentX = startX;
			row.forEach(key => {
				const keyButtonWidth = keySpacingX * 0.8;
				const keyButtonHeight = keySpacingY * 0.8;
				const keyButton = scene.add.rectangle(currentX + keyButtonWidth / 2, currentY + keyButtonHeight / 2, keyButtonWidth, keyButtonHeight, 0x000000)
					.setStrokeStyle(4, 0xffffff)
					.setInteractive({ useHandCursor: true });
				const keyText = scene.add.text(currentX + keyButtonWidth / 2, currentY + keyButtonHeight / 2, key.toUpperCase(), {
					fontSize: `${keyButtonHeight / 1.5}px`,
					fill: '#0f0'
				}).setOrigin(0.5);
				
				keyButton.on('pointerdown', () => {
					handleKeyInput(key);
					clickSound.play();
					keyButton.setFillStyle(0x888888); // Click effect
				});
				
				keyButton.on('pointerover', () => {
					keyButton.setStrokeStyle(4, 0xffff00); // Hover effect
				});
				
				keyButton.on('pointerout', () => {
					keyButton.setStrokeStyle(4, 0xffffff); // Reset effect
				});
				
				keyButton.on('pointerup', () => {
					keyButton.setFillStyle(0x000000); // Reset click effect
				});
				
				keyboardKeys.push({ keyButton, keyText });
				currentX += keySpacingX;
			});
			currentY += keySpacingY;
		});
	}
	
	function handleKeyInput(key) {
		if (key === '←') {
			if (answerText.text.length > 0) {
				answerText.text = answerText.text.slice(0, -1);
			}
		} else if (answerText.text.length < 3) {
			answerText.text += key.toUpperCase();
		}
	}
	
	function handleSubmit() {
		let temp_log = localStorage.getItem('log');
		if (temp_log === null) {
			temp_log = '';
		}
		temp_log += `Question: ${questions[currentQuestionIndex]} - Answer submitted: ${answerText.text}\n`;
		localStorage.setItem('log', temp_log);
		
		if (answerText.text === 'YES' || answerText.text === 'NO') {
			successSound.play();
			// Proceed to the next question in incrementing order
			currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
			questionText.setText(questions[currentQuestionIndex]);
			answerText.text = '';
			failedAttempts = 0;
		} else {
			failedAttempts++;
			showTryAgainMessage();
			answerText.text = '';
			
			if (failedAttempts >= maxFailedAttemptsBeforeYesNo) {
				showYesNoButtons();
			}
		}
	}
	
	function handleAnswer(answer) {
		successSound.play();
		
		let temp_log = localStorage.getItem('log');
		if (temp_log === null) {
			temp_log = '';
		}
		temp_log += `Question: ${questions[currentQuestionIndex]} - Answer submitted: ${answer}\n`;
		localStorage.setItem('log', temp_log);
		
		// Proceed to the next question in incrementing order
		currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
		questionText.setText(questions[currentQuestionIndex]);
		answerText.text = '';
		failedAttempts = 0;
		if (!disableKeyboard) {
			hideYesNoButtons();
		}
	}
	
	function showTryAgainMessage() {
		// Disable all buttons
		if (!disableKeyboard) {
			keyboardKeys.forEach(({ keyButton }) => keyButton.disableInteractive());
		}
		submitButton.disableInteractive();
		backspaceButton.disableInteractive();
		
		// Show the "Please try again" message and play buzzer sound
		tryAgainText.setVisible(true);
		buzzerSound.play();
		
		setTimeout(() => {
			tryAgainText.setVisible(false);
			// Re-enable all buttons
			if (!disableKeyboard) {
				keyboardKeys.forEach(({ keyButton }) => keyButton.setInteractive({ useHandCursor: true }));
			}
			submitButton.setInteractive({ useHandCursor: true });
			backspaceButton.setInteractive({ useHandCursor: true });
		}, 3000);
	}
	
	function showYesNoButtons() {
		yesNoBackgroundBox.setVisible(true);
		yesButtonBox.setVisible(true);
		noButtonBox.setVisible(true);
		yesButton.setVisible(true).setInteractive({ useHandCursor: true });
		noButton.setVisible(true).setInteractive({ useHandCursor: true });
		yesButtonText.setVisible(true);
		noButtonText.setVisible(true);
	}
	
	function hideYesNoButtons() {
		yesNoBackgroundBox.setVisible(false);
		yesButtonBox.setVisible(false);
		noButtonBox.setVisible(false);
		yesButton.setVisible(false).disableInteractive();
		noButton.setVisible(false).disableInteractive();
		yesButtonText.setVisible(false);
		noButtonText.setVisible(false);
	}
	
	function update() {
		// Update logic if needed
	}
	
	// Resize game when the window is resized
	window.addEventListener('resize', () => {
		game.scale.resize(window.innerWidth, window.innerHeight);
	});
</script>
</body>
</html>
